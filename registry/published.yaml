# Registry files a published bundle or dataset was built with, frozen (docs/PROFILES.md §7).
#
# ! A published dataset names the profile that made it (`profile_ref`), and `ravel update`
# rebuilds the texts of its vectors with that profile (`embed/reuse.py`). Edited in place,
# the name would point at rules the data was not made by, and the rebuild would be wrong
# without failing. So a change is a new version file beside the old one, and the old one
# stays. `tests/test_registry_published.py` fails if a file below is edited or removed.
#
# The digest is sha256 of the file with CRLF read as LF, so a Windows checkout agrees.
# Add the files of every bundle at the moment it is published.

