# Measured on the machine this project was first built on (2026-11-07), embedding
# id_reg_markdown with Qwen3-Embedding-0.6B in fp16 through the transformers backend.
id: rtx-3070-ti-laptop-8gb
match:
  gpu_contains: ["3070 Ti"]
  vram_gb_max: 9
batch_items: 32
batch_bytes: 40000
# Attention memory grows with the square of the length: items x longest^2 (bytes) is what
# keeps three 4,000-token chunks from sharing a batch that needs ~6 GB.
batch_square: 150000000
measured:
  device: NVIDIA GeForce RTX 3070 Ti Laptop GPU
  vram_gb: 8.59
  model: Qwen/Qwen3-Embedding-0.6B
  backend: transformers
  tokens_per_second: 11000
  note: >
    Compute-bound and thermally throttled (87 C, SM 1215 of 1785 MHz). items=64 was
    slower (31 vs 34 chunks/s on the sample) and 128 items with 60,000 bytes fell off a
    memory cliff (4.7/s). About 15 minutes per 20,000 vectors on this corpus.
notes: Tuned by hand; the first profile, kept as the reference the estimate scales from.
