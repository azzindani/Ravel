id: generic
version: "1.0"
title: Generic structured document
description: >
  The fallback when no corpus profile matches. Recognizes numbered and titled
  sections common to reports, standards, manuals and scraped articles, in English
  or Indonesian. Deliberately conservative: it is better to leave a heading
  undetected than to split a document on a line that was prose.

  Its real job is to prove the engine is not Indonesian-specific. Everything the
  `id_regulation` profile does, this does with different data and no code changes.

match:
  mime:
    - application/pdf
    - text/html
    - text/plain
    - text/markdown
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  content: []
  min_hits: 0          # matches anything; lowest priority by construction
  priority: -100

structure:
  max_line_chars: 120
  max_title_chars: 90
  prose_tail: [".", ":", ";", ",", "?", "!"]

  units:
    # 1.  /  1.2  /  1.2.3  — depth follows the dot count, capped by the engine.
    - name: numbered_1
      level: 2
      pattern: '^(\d+)\.?\s+(?=[A-Z“"(])'
    - name: numbered_2
      level: 3
      pattern: '^(\d+\.\d+)\.?\s+'
    - name: numbered_3
      level: 4
      pattern: '^(\d+\.\d+\.\d+)\.?\s+'
    # Word-led sections, English and Indonesian.
    - name: chapter
      level: 2
      pattern: '^(?:CHAPTER|BAB)\s+(?:[IVXLCDM]+|\d+)\b'
    - name: part
      level: 2
      pattern: '^(?:PART|BAGIAN)\s+(?:[IVXLCDM]+|\d+)\b'
    - name: section
      level: 3
      pattern: '^(?:SECTION|PASAL|ARTICLE)\s+\d+[A-Z]?\b'
      marker_only: true
    - name: appendix
      level: 2
      pattern: '^(?:APPENDIX|ANNEX|LAMPIRAN)\s+(?:[IVXLCDM]+|[A-Z]|\d+)?\b'

  sections:
    - name: abstract
      level: 2
      pattern: '^(?:ABSTRACT|ABSTRAK|RINGKASAN)\s*:?\s*$'
    - name: introduction
      level: 2
      pattern: '^(?:INTRODUCTION|PENDAHULUAN)\s*:?\s*$'
    - name: conclusion
      level: 2
      pattern: '^(?:CONCLUSION|KESIMPULAN|PENUTUP)\s*:?\s*$'
    - name: references
      level: 2
      pattern: '^(?:REFERENCES|BIBLIOGRAPHY|DAFTAR\s+PUSTAKA)\s*:?\s*$'

  subunits:
    letter: '^([a-z])[.)]\s+'
    roman: '^\(([ivx]+)\)\s+'
    bullet: '^[-•*]\s+'

identity:
  types: []
  flags: [ignorecase]

cleanup:
  boilerplate:
    - '^\s*(?:page\s+\d+(?:\s+of\s+\d+)?|halaman\s+\d+)\s*$'
    - '^\s*[-–—]{3,}\s*$'
  min_indexable_chars: 24

# ---------------------------------------------------------------------------
# Scoring vocabulary · English, and that is the whole demonstration.
#
# ! This profile's description promises that everything `id_regulation` does,
# this does "with different data and no code changes". Until this block existed
# that was false: `enrich/factors.py` carried the annex patterns and a 26-word
# Indonesian term list as constants, so a generic corpus got
# `legal_term_density` of ~0 on every row and a `completeness` that had quietly
# degraded to length alone, with nothing in the output saying so.
# ---------------------------------------------------------------------------
scoring:
  # No hierarchy is declared (`identity.authority` is empty), so `authority` is
  # None on every row and the scale is unused. It is stated rather than omitted
  # because a corpus that later gains a ladder edits one number.
  authority_scale: 10

  annex: ['APPENDIX', 'ANNEX', 'LAMPIRAN', 'REFERENCES', 'BIBLIOGRAPHY', 'DAFTAR\s+PUSTAKA']
  operative: ['SECTION', 'CHAPTER', 'ARTICLE', 'PASAL', 'BAB', '\d+(\.\d+)*\.?\s']
  annex_score: 0.2
  operative_score: 1.0
  labelled_score: 0.6

  # ! Modal and normative verbs, ✗ legal ones. RFC 2119 keywords plus the ordinary
  # English of a requirement. The factor asks "does this state a rule or describe
  # one", which is what separates a whole provision from a fragment in a standard,
  # a manual or a policy just as much as in a statute.
  terms:
    - must
    - shall
    - should
    - may
    - required
    - recommended
    - prohibited
    - optional
    - responsible
    - ensure
    - comply
    - requirement
    - obligation
    - provision
    - section
    - clause
    - defined
    - applies
    - subject

  # A conventional English closed-class list. Short and boring on purpose: a stop
  # list is a claim about which words carry no information, and a long one quietly
  # deletes evidence.
  stopwords:
    - the
    - and
    - for
    - with
    - that
    - this
    - from
    - are
    - was
    - were
    - has
    - have
    - been
    - not
    - any
    - all
    - its
    - their
    - which
    - what
    - when
    - where
    - who
    - how
  min_term_chars: 3

extract:
  native:
    # With no corpus patterns to lean on, typography is the only signal there is —
    # so the generic profile keeps the extractor's heading guesses instead of
    # demoting them.
    heading_size_ratio: 1.15
    heading_max_chars: 100
    running_page_share: 0.5
  trust_typography: true
