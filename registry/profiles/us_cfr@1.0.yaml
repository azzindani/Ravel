id: us_cfr
version: "1.0"
title: US Code of Federal Regulations (CFR and eCFR XML)
description: >
  The annual CFR (govinfo bulk, one XML per printed volume) and the eCFR (versioner API, one
  XML per title), read by the `cfr_xml` extractor and chunked by `markup`
  (docs/SOURCE_US_CFR.md). The structure is the XML's: every heading names its unit, so the
  patterns below are label rules and never promote text. Identity is read per part from the
  headings in force, because one volume holds many parts from several agencies.

match:
  mime: [text/xml, application/xml]
  content: ['<CFRDOC\b', '<ECFR\b', 'TYPE="PART"']
  min_hits: 1

structure:
  # ! The extractor sets these levels (`extract.cfr.LEVELS`); the structurer counts any
  # heading whose unit or level disagrees, and the tests pin that count at zero.
  from_markup: true
  units:
    - {name: title, level: 1, pattern: '^Title\s+\d+'}
    - {name: subtitle, level: 2, pattern: '^Subtitle\s+\w+'}
    - {name: chapter, level: 3, pattern: '^CHAPTER\s+[IVXLCDM\d]+'}
    - {name: subchapter, level: 4, pattern: '^SUBCHAPTER\s+\w+'}
    # The part is what the `chapter` column holds: the unit a reader names after the title.
    - {name: part, level: 5, pattern: '^PARTS?\s+\d+', role: chapter}
    - {name: subpart, level: 6, pattern: '^Subpart\s+\w+'}
    - {name: subjgrp, level: 7, pattern: '^.'}
    - {name: section, level: 8, pattern: '^§', role: article}
    - {name: appendix, level: 8, pattern: '^Appendix', role: article}

identity:
  markup:
    scope: part
    facts:
      regulation_type: "CFR"
      regulation_number: "{title.number} CFR Part {part.number}"
      # The chapter is the issuing agency (`CHAPTER I—ENVIRONMENTAL PROTECTION AGENCY`);
      # a part directly under a subtitle has none, and the field stays empty.
      enacting_body: "{chapter.name}"
      about: "{part.name}"
      year: "{title.year}"
      # The edition's date: `Revised as of January 1, 2026` for the CFR, the last amendment
      # for the eCFR. ISO, so it sorts.
      effective_date: "{title.date}"
    identifier:
      section: "{title.number} CFR {section.number}"
      appendix: "{title.number} CFR {appendix.marker}"
      part: "{title.number} CFR Part {part.number}"
      subpart: "{title.number} CFR Part {part.number} Subpart {subpart.number}"
      subjgrp: "{title.number} CFR Part {part.number}"
      title: "{title.number} CFR"

pipeline:
  chunk:
    chunker: markup
    # One chunk per section or appendix; longer ones split into `part n of m` on paragraph
    # boundaries. ! Determined, ✗ measured: no CFR eval set exists yet.
    max_tokens: 1024
    min_tokens: 0
  derive:
    # What the embedder sees before the body:
    #
    #   Citation: 2 CFR 170.105
    #   Agency: OFFICE OF MANAGEMENT AND BUDGET GOVERNMENT-WIDE GUIDANCE ...
    #   Location: Title 2—Federal Financial Assistance › ... › § 170.105 Applicability.
    #
    # ✗ the edition date: it changes every year while the text may not.
    embed_text:
      separator: "\n"
      context:
        - "Citation: {identifier}"
        - "Agency: {enacting_body}"
        - "Location: {heading_path}"
  expected:
    coverage:
      identifier: 0.99
      regulation_number: 0.95
      heading_path: 0.99
    max_row_tokens: 8192
    oversize_share: 0.001
