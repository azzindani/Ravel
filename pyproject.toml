[project]
name = "ravel"
version = "0.0.1"
description = "Offline corpus compiler: documents in, verifiable corpus bundle out."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

# Core stays small: every face (CLI, MCP, HTTP) and every stage builds on these.
dependencies = [
    "pydantic>=2.13",
    "pyarrow>=25.0",
    "fsspec>=2026.7",
    # ! Capped by docling, which pins typer<0.27 (verified 2026-09-12). Raising
    # this breaks `[extract]` resolution — STACK.md §7.
    "typer>=0.15,<0.27",
    "rich>=14",
    "numpy>=2.5",
    "pyyaml>=6.0",
    # ! Windows ships no system tz database, so pyarrow cannot read a tz-aware
    # timestamp column back into Python without it. Not optional: the canonical
    # format stores `extracted_at` as timestamp(us, tz=UTC).
    "tzdata>=2026.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
extract = ["pymupdf>=1.28", "docling>=2.126", "transformers>=5.17", "torch>=2.13"]  # ! torch floor set by vLLM, which pins it exactly
embed   = ["transformers>=5.17", "sentence-transformers>=6.0", "openai>=2.0"]
cluster = ["faiss-cpu>=1.15", "scikit-learn>=1.9"]
load    = ["psycopg[binary]>=3.3"]
mcp     = ["mcp>=2.2"]
service = ["fastapi>=0.141", "uvicorn>=0.40"]
remote  = ["huggingface-hub>=1.31", "s3fs>=2026.7"]
# ! linux-only accelerators. Markers make this a no-op on Windows rather than a
# failed install — STACK.md §1: these are accelerators, never dependencies.
# ! There is deliberately NO [gpu] extra. vLLM pins torch exactly (==2.13.0),
# caps fastapi (<0.137) and is linux-only; faiss-gpu-cu12 has no cp314 wheels at
# all (max cp313). Dragging either into this resolution universe would let an
# accelerator dictate the whole project's versions — the exact inversion
# STACK.md §1 forbids. Both are installed separately on the GPU box, in their own
# layer: docker/requirements-gpu.txt.

[project.scripts]
ravel = "cli:app"

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.15", "mypy>=1.18", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: each functional package is a top-level import root.
# ! Never name one after an installed distribution — `mcp_server`, not `mcp`.
packages = [
    "src/canon", "src/sources", "src/extract", "src/chunk", "src/enrich",
    "src/embed", "src/cluster", "src/bundle", "src/load", "src/runtime",
    "src/variants", "src/evaluate", "src/mcp_server", "src/service",
]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 96
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# ! `-m "not samples"` by default. The samples suite reads 158 real PDFs and needs the
# `extract` extra; the rest of the suite is hermetic and must stay instant so it is
# actually run. `pytest -m samples` for the routing guard.
addopts = "-q -m 'not samples'"
markers = [
    "samples: routing checks against the real PDFs in samples/ (needs the extract extra)",
]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true

# ! Per module, never `ignore_missing_imports = true` globally. A global switch also
# silences a typo in one of *our* module names, which is the one import error worth
# having. These ship no stubs and no py.typed marker; PyYAML does ship stubs, so
# `types-PyYAML` is a dev dependency rather than an entry here — a real type is always
# worth more than a silenced one.
[[tool.mypy.overrides]]
module = ["fsspec.*", "pyarrow.*", "pymupdf.*", "docling.*", "psycopg.*"]
ignore_missing_imports = true
