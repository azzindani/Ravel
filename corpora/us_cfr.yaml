id: us_cfr
title: US Code of Federal Regulations (official annual edition)
description: >
  The CFR as published by GPO on govinfo: the newest annual edition of every title, one XML
  per printed volume (docs/SOURCE_US_CFR.md). Official: prima facie evidence of the original
  documents (44 U.S.C. 1510). Fetched by `ravel sources fetch us_cfr`; sources are read-only
  and not in git. Build each snapshot in its own workspace (-w work/us_cfr/<date>).

sources:
  root: sources/US_CFR
  include: ["**/*.xml"]
  snapshot: current.txt

fetch:
  kind: govinfo_cfr
  listing: https://www.govinfo.gov/bulkdata/json/CFR
  files: https://www.govinfo.gov/bulkdata/CFR/
  edition: latest
  lookback: 3
  delay_s: 1.0

provenance:
  # ! The path of a file below sources.root is its path below this, by construction
  # (fetch.files must equal it): every chunk cites the exact govinfo file it was read from.
  base_url: https://www.govinfo.gov/bulkdata/CFR/
  note: GPO govinfo CFR bulk data, annual edition XML per volume.

extract:
  profile: us_cfr@1.1
  extractors: [xml]
  failure_tolerance: 0.0

chunk:
  chunker: markup

embed:
  # The same space as id_reg_markdown (one model, one revision, one recipe), so every corpus
  # is served by the same Vera build. Embedded through the docker vLLM server:
  # `ravel embed <corpus> -w <ws> --base-url http://localhost:8000/v1`.
  kind: local
  id: qwen3-embedding-0.6b-local
  model: Qwen/Qwen3-Embedding-0.6B
  revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
  dim: 1024
  pooling: last_token
  padding_side: left
  normalize: true
  instruction_style: prefix
  doc_instruction: ""
  query_instruction: "Given a legal or regulatory question, retrieve passages that answer it"
  max_length: 8192
  dtype: float16
  vector_dtype: float16
  hardware: auto
  shard_rows: 20000
