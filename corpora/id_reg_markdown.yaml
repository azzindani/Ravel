id: id_reg_markdown
title: Indonesian regulations (Markdown)
description: >
  Azzindani/ID_REG_Markdown: 46,451 regulation files already extracted to Markdown, read
  with the id_regulation_md profile. The corpus Vera is rebuilt from
  (docs/SOURCE_ID_REG_MARKDOWN.md). Sources are read-only inputs and are not in git.

sources:
  root: work/id_reg_markdown
  include: ["**/*.md"]

provenance:
  # ! Where the exact hashed bytes authoritatively live, not a portal search URL
  # constructed from parsed metadata (CHUNKING.md §4).
  base_url: hf://datasets/Azzindani/ID_REG_Markdown/

extract:
  profile: id_regulation_md
  extractors: [text]
  failure_tolerance: 0.02

chunk:
  chunker: unit
  # ! Stated here, so it wins over the profile's `max_tokens: 4096` (`ChunkSpec.to_config`).
  # 512 is the measured one: p50 147, p90 507 tokens, no chunk past the model's 8,192.
  max_tokens: 512
  min_tokens: 24

embed:
  # The one vector space every regulation corpus shares, declared once
  # (registry/embedders/): one Vera build and one index serve them all.
  use: qwen3-embedding-0.6b@1.0

gate:
  # Jurisdictions this corpus does not cover. `ravel db calibrate` records them in
  # corpus_meta.gate; Vera refuses a query naming one unless a retrieved text names it too,
  # so Indonesia's own treaties stay answerable (Vera docs/ROADMAP.md Stage 1: off-topic
  # refused 62 -> 74 of 106, real questions refused 0 of 496).
  foreign: [
    malaysia, singapura, singapore, thailand, filipina, philippine, philippines,
    vietnam, brunei, myanmar, kamboja, laos, timor leste, australia, selandia baru,
    new zealand, jepang, japan, japanese, korea, tiongkok, china, cina, taiwan, hong
    kong, india, pakistan, bangladesh, arab saudi, saudi, uni emirat arab, emirat,
    qatar, mesir, egypt, turki, turkey, iran, amerika serikat, amerika, united states,
    usa, kanada, canada, meksiko, brasil, brazil, inggris, united kingdom, england,
    britain, british, belanda, netherlands, dutch, jerman, germany, prancis, perancis,
    france, italia, spanyol, swedia, sweden, norwegia, denmark, finlandia, swiss,
    rusia, russia, uni eropa, european union, eu, gdpr, pdpa
  ]
