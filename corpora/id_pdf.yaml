id: id_pdf
title: Indonesian regulations (PDF, read by docling)
description: >
  sources/ID_PDF: 991 regulation PDFs (PERBUP, PERGUB, PERMEN, SE, ...), read by the
  docling extractor rather than PyMuPDF (EXTRACTION.md §2b). A born-digital PDF keeps
  its text and gains docling's layout and tables; a damaged or absent text layer is
  re-read from the page image by a vision-language model. Output goes to the workspace
  (canon/id_pdf/<generation>/), never beside the sources.

sources:
  root: sources/ID_PDF
  include: ["*.[pP][dD][fF]"]

provenance:
  # ! A local URI, and deliberately so. These files were collected by hand and no
  # publisher URL has been verified for any of them; the HF dataset ID_REG holds zips,
  # so a per-file hf:// path would not resolve (checked 2026-11-28: 404). Until a
  # url_map names each file's publisher page, the sha256 recorded on every chunk is the
  # citation, and a link is never made up (CHUNKING.md §4).
  base_url: file:///sources/ID_PDF/
  note: >
    Hand-collected regulation PDFs. Each document carries the sha256 of the exact file
    it came from; no publisher URL has been verified yet.

extract:
  profile: id_regulation
  extractors: [docling]
  docling:
    clean: standard       # keep the born-digital text; add layout and TableFormer
    damaged: vlm          # damaged or absent layer: re-read the page with the VLM
    vlm_preset: granite_docling
    # A vLLM server (docker/compose.vllm-docling.yml), local or on a rented GPU. The
    # in-process engine read ~23 s/page on the 8 GB laptop (EXTRACTION.md §2b).
    vlm_engine: api
    vlm_url: http://localhost:8001/v1/chat/completions
    # 8 ranges of 4 pages in flight, each sent as one batch: docling alone keeps 3-4
    # pages in flight and read 1.9 s a page; this read 1.0 (EXTRACTION.md §2b).
    vlm_workers: 8
    vlm_pages_per_call: 4
    vlm_batch: 4
    vlm_concurrency: 4
    vlm_max_tokens: 4096
    # Stop a looping page when its output ends in the same 3-64-token pattern 8 times:
    # 2.06 pages/s against 1.02 on a scan, same F1 on clean pages (EXTRACTION.md §2b).
    vlm_stop_repeats: {min_pattern_size: 3, max_pattern_size: 64, min_count: 8}
    # A CLEAN layer that is somebody's old OCR: judged by the word list, page by page, and
    # re-read from the image when unusable (EXTRACTION.md §2b, QUALITY.md §2).
    reread_unusable:
      lexicon: lexicons/id_regulation_md@1.txt
    tables: true
    # Table-heavy annexes: 2.2x faster than accurate, more tables structured (EXTRACTION.md §2b).
    table_mode: fast
    device: auto
  # A docling document holds paragraphs, not lines, so far fewer blocks than native;
  # the cap stays, because this corpus has to run on an 8 GB box too.
  shard_max_blocks: 250000
  # Seal every 5 documents: a docling document costs minutes, so a stop loses at most 5.
  shard_max_docs: 5
  # A clean PDF reads on this GPU, a scanned one on the VLM server: three workers keep
  # one of each in flight (docling's lanes allow one per pipeline) instead of taking turns.
  workers: 3
  failure_tolerance: 0.05

chunk:
  chunker: unit
  # The standard's budget (docs/pipeline/STANDARD.md §2), in the embedder's tokens.
  max_tokens: 4096
  min_tokens: 8
  carry_parent: true

embed:
  # The one vector space every regulation corpus shares, declared once
  # (registry/embedders/): one Vera build and one index serve them all.
  use: qwen3-embedding-0.6b@1.0
