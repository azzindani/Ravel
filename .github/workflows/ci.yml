name: CI

# Two stages, mirroring the phase split:
#   fast — lint, and the hermetic suite on all three platforms
#   full — the generated SQL executed against a real Postgres, and the routing
#          guard run over the 158 sample PDFs
#
# The `full` stages run on Linux only. One is testing SQL semantics against a
# Postgres server, which behaves the same whichever OS drove the client; the
# other reads PDFs, which do not change by platform either. Paying three times
# for one answer buys nothing.
#
# ! Windows is in the fast matrix and is not optional. Ravel is developed on a
# Windows workstation and runs on Linux GPU boxes, and the failures that only
# appear on one of them — CRLF in a parquet round-trip, a missing tz database,
# a console codepage that cannot print a step note — are exactly the ones a
# Linux-only gate would hand to whoever is least equipped to fix them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A new push supersedes the old one instead of queueing behind
# it, so a busy branch does not sit waiting on stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast on a network hiccup rather than hanging the job for minutes.
  UV_HTTP_TIMEOUT: 60
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  # Formatting and lint are platform-independent, so checking once is enough.
  # Running them on all three would only add ways for line endings to bite.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/samples
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked so CI fails on an out-of-date uv.lock rather than silently
      # resolving different versions than the developer had.
      - run: uv sync --locked --all-extras --no-extra extract --no-extra mcp
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools

      # ! `src tools`, not `src`. tools/ is what this workflow runs against a live
      # database, so a type error there is a job that fails after Postgres has
      # started — the most expensive place in the gate to find one.
      #
      # tests/ is deliberately outside it: strict mypy over pytest fixtures and
      # parametrize decorators is 106 errors of annotation ceremony, and none of
      # them are a defect in something that ships.
      - run: uv run mypy src tools

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # ! Never cancel siblings. A Windows-only failure is exactly the thing this
      # matrix exists to find, and fail-fast would hide whether Linux and macOS
      # were fine.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # The hermetic suite never opens samples/, and skipping 165 MB of PDFs on
      # three runners per push is the difference between a gate people wait for
      # and one they route around.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/samples

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        # The heavy extras are excluded deliberately: `extract` pulls docling and
        # torch (~2 GB) for a suite that imports neither. The samples job installs
        # the one library it actually needs.
        run: uv sync --locked --all-extras --no-extra extract --no-extra mcp

      - name: Test
        run: uv run pytest -q

  # The stage that would have caught `COPY ... FROM '<path>.parquet'`. Everything
  # in tests/test_load.py asserts things about strings, and a string that looks
  # like SQL is not SQL — the load plan, the generated DDL and both guard blocks
  # had never been executed by a database until this job existed.
  integration:
    name: integration (postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ravel
          POSTGRES_PASSWORD: ravel
          POSTGRES_DB: ravel
          # ! Locale pinned. Collation changes ORDER BY on text, and a corpus
          # whose ranking differs between CI and the deployment is worse than one
          # with no ranking test at all.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ravel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: host=localhost port=5432 dbname=ravel user=ravel password=ravel

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/samples

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --extra load

      - name: Execute the generated schema and load plan
        run: uv run python tools/ci_bundle_check.py

  # The other half of `CLAUDE.md` §12's cost. A profile can be widened by anyone,
  # and a widened `match.content` pattern has no local symptom — it produces a
  # plausible parse of a document it should never have seen. 144 of these 158
  # PDFs are not regulations, and none of them may be claimed by id_regulation.
  #
  # Separate job because it needs the PDFs (165 MB) and PyMuPDF, and the default
  # suite must stay hermetic and instant so that it is actually run.
  samples:
    name: routing (158 real PDFs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # ! pymupdf alone, not `--extra extract`. The routing guard reads page text
      # and nothing else; the extra would drag in docling and torch for it.
      - run: uv run --with pymupdf pytest -m samples -q

  # The CLI is the primary face and must work with nothing else running
  # (`INTERFACES.md` §1). A package that imports cleanly can still ship a console
  # script that does not, and that failure reaches the operator, not the test
  # suite.
  cli:
    name: cli runs from an installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/samples
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build and install the wheel
        run: |
          uv build --wheel
          uv venv /tmp/venv
          VIRTUAL_ENV=/tmp/venv uv pip install dist/*.whl

      - name: It runs, and it can see the registry
        run: |
          /tmp/venv/bin/ravel version
          /tmp/venv/bin/ravel profiles list
          /tmp/venv/bin/ravel --help

      - name: It refuses a bundle that is not one
        # ! A gate that cannot fail proves nothing. `bundle verify` on an empty
        # directory must exit non-zero AND name the check that refused it —
        # otherwise a traceback would pass this step just as well.
        #
        # ! Asserted against `--json`, never against the human report. The first
        # version of this step grepped the rendered output for "unsealed build
        # directory" and went red on the runner while passing locally: rich
        # reflows prose to the terminal width, and at the runner's 80 columns the
        # line broke between "build" and "directory". The command was correct;
        # the assertion was reading a soft-wrap position.
        run: |
          mkdir -p /tmp/not-a-bundle
          # `if`, not `cmd && { fail }`: these steps run under `bash -e`, where a
          # failing AND-OR list still exits the script — so the correct refusal
          # would fail the step. An `if` condition is exempt from -e.
          if out=$(/tmp/venv/bin/ravel bundle verify /tmp/not-a-bundle --json); then
            echo "expected a refusal, got success:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | /tmp/venv/bin/python -c "
          import json, sys
          report = json.load(sys.stdin)
          assert report['passed'] is False, report
          assert report['failed'] == ['manifest'], report['failed']
          print('refused by the manifest check, as it must be')
          "

# ------------------------------------------------------------------------------
# What this gate enforces, and what it does not
# ------------------------------------------------------------------------------
# Enforced: ruff lint, ruff format, mypy --strict over src/ and tools/, the
# hermetic suite on three platforms, the generated SQL against a real pgvector
# server, profile routing over 158 real PDFs, and the CLI from an installed
# wheel.
#
# Not enforced: mypy over tests/. Everything else this file could reasonably
# check, it checks — and nothing here is marked `continue-on-error`, because a
# check in the gate that is allowed to fail is decorative, and this project's own
# load preflight refuses to call a skipped check a passed one.
